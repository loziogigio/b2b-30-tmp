name: Storefront security
on:
  pull_request:
  push:
    branches: [main, master, dev]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security/package-lock.json
      - run: npm ci --prefix security --ignore-scripts
      - run: npm test --prefix security
